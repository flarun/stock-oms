<!DOCTYPE html>
<html>
<head>
    <title>Stock OMS Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #121212; color: #ffffff; padding: 20px;}
        .container { display: flex; gap: 20px; }
        .panel { background-color: #1e1e1e; padding: 20px; border-radius: 8px; flex: 1; border: 1px solid #333; }
        input, select, button { width: 100%; padding: 10px; margin-top: 10px; background: #333; color: white; border: none; box-sizing: border-box;}
        button { background: #007bff; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .log { height: 300px; overflow-y: scroll; background: #000; padding: 10px; margin-top: 10px; border: 1px solid #444; }
        .trade { color: #00e676; }
        .depth { color: #2196f3; }
    </style>
</head>
<body>
<h2>OMS Execution Terminal</h2>
<div class="container">
    <div class="panel">
        <h3>Place Order</h3>
        <input type="text" id="symbol" value="AAPL" disabled>
        <select id="side">
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
        </select>
        <input type="number" id="price" placeholder="Price (Cents, e.g. 15000)">
        <input type="number" id="quantity" placeholder="Quantity">
        <button onclick="sendOrder()">Submit Order</button>
    </div>
    <div class="panel">
        <h3>Market Events</h3>
        <div id="eventsLog" class="log"></div>
    </div>
</div>

<script>
    let stompClient = null;

    function connect() {
        let socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
            stompClient.subscribe('/topic/trades', function (message) {
                logEvent(message.body, 'trade');
            });
            stompClient.subscribe('/topic/depth', function (message) {
                logEvent(message.body, 'depth');
            });
        });
    }

    function sendOrder() {
        let order = {
            symbol: document.getElementById("symbol").value,
            side: document.getElementById("side").value,
            price: parseInt(document.getElementById("price").value),
            quantity: parseInt(document.getElementById("quantity").value)
        };
        fetch('/api/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(order)
        });
    }

    function logEvent(text, typeClass) {
        let log = document.getElementById("eventsLog");
        log.innerHTML = `<div class="${typeClass}">${new Date().toLocaleTimeString()} - ${text}</div>` + log.innerHTML;
    }

    window.onload = connect;
</script>
</body>
</html>
